apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: heureka-service-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: heureka-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/heureka-service
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/auth-microservice
        property: JWT_SECRET
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: secret/prod/heureka-service
        property: PAYMENT_API_KEY
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/heureka-service
        property: PAYMENT_APPLICATION_ID
    - secretKey: PAYMENT_WEBHOOK_API_KEY
      remoteRef:
        key: secret/prod/heureka-service
        property: PAYMENT_WEBHOOK_API_KEY

    - secretKey: WAREHOUSE_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/heureka-service
        property: WAREHOUSE_SERVICE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    # Its own Vault property, NOT JWT_TOKEN: that property is the shared a2880693
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/heureka-service
        property: ORDERS_SERVICE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    # path as CREDENTIAL_INGEST_TOKEN. Do NOT share monitoring's
    - secretKey: MONITORING_INGEST_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/heureka-service
        property: CREDENTIAL_INGEST_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    - secretKey: CATALOG_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/heureka-service
        property: CATALOG_SERVICE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    # Role internal:logging-microservice:ingest. Without this the service ships
    # no logs at all: LogIngestGuard fails closed (401) and every log line is
    # lost silently, so error alerting cannot see this service.
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/heureka-service
        property: LOGGING_SERVICE_TOKEN
