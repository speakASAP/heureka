apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: heureka-service-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: heureka-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/heureka-service
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/auth-microservice
        property: JWT_SECRET
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: secret/prod/heureka-service
        property: PAYMENT_API_KEY
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/heureka-service
        property: PAYMENT_APPLICATION_ID
    - secretKey: PAYMENT_WEBHOOK_API_KEY
      remoteRef:
        key: secret/prod/heureka-service
        property: PAYMENT_WEBHOOK_API_KEY

    - secretKey: WAREHOUSE_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/heureka-service
        property: WAREHOUSE_SERVICE_TOKEN
    # Inbound guard credential for callers that mutate heureka's feed and ingest
    # orders (HeurekaFeedMutationGuard / HeurekaOrderIngestionGuard). Sourced from
    # catalog-microservice's own identity credential, NOT JWT_TOKEN: that property
    # held the shared a2880693 value. catalog-microservice presents this same value
    # as CATALOG_INTERNAL_SERVICE_TOKEN, so one property serves both sides.
    - secretKey: HEUREKA_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: CATALOG_INTERNAL_SERVICE_TOKEN
    # Per-pair RS256 principal for the heureka-service -> orders-microservice lane.
    # Its own Vault property, NOT JWT_TOKEN: that property is the shared a2880693
    # value. HEUREKA_INTERNAL_SERVICE_TOKEN above no longer shares it.
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/heureka-service
        property: ORDERS_SERVICE_TOKEN
