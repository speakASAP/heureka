apiVersion: apps/v1
kind: Deployment
metadata:
  name: heureka-service
  namespace: statex-apps
  labels:
    app: heureka-service
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heureka-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: heureka-service
    spec:
      containers:
        - name: app
          image: localhost:5000/heureka-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3800
          envFrom:
            - configMapRef:
                name: heureka-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: heureka-database-url-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: heureka-service-secret
                  key: JWT_SECRET
            - name: JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: heureka-service-secret
                  key: JWT_TOKEN
            # Must be heureka's own credential: orders-microservice compares this
            # value byte-for-byte against secret/prod/heureka-service#JWT_TOKEN.
            # It previously pointed at catalog's token, so the comparison could
            # never match and order forwarding returned 401 in production.
            - name: HEUREKA_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: heureka-service-secret
                  key: JWT_TOKEN
            - name: WAREHOUSE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: warehouse-microservice-secret
                  key: CLIPLOT_WAREHOUSE_SERVICE_TOKEN
          startupProbe:
            httpGet:
              path: /health
              port: 3800
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3800
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3800
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
