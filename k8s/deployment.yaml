apiVersion: apps/v1
kind: Deployment
metadata:
  name: heureka-service
  namespace: statex-apps
  labels:
    app: heureka-service
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heureka-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: heureka-service
    spec:
      containers:
        - name: app
          image: localhost:5000/heureka-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3800
          envFrom:
            - configMapRef:
                name: heureka-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: heureka-database-url-secret
                  key: DB_PASSWORD
            # Ingest credential for credential self-reports
            # (SERVICE_CREDENTIAL_PROBER_PLAN.md Task A). This deployment maps secret
            # keys one by one rather than with envFrom: secretRef, so adding the key
            # to the ExternalSecret alone does NOT reach the container.
            - name: NOTIFICATION_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: heureka-service-secret
                  key: NOTIFICATION_SERVICE_TOKEN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: heureka-service-secret
                  key: JWT_SECRET
            - name: WAREHOUSE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: warehouse-microservice-secret
                  key: CLIPLOT_WAREHOUSE_SERVICE_TOKEN
            # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
            - name: ORDERS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: heureka-service-secret
                  key: ORDERS_SERVICE_TOKEN
            # Same rule as the note above: this deployment maps secret keys one
            # by one, so the ExternalSecret entry alone does NOT reach the
            # container. Per-pair principal for the catalog lane.
            - name: CATALOG_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: heureka-service-secret
                  key: CATALOG_SERVICE_TOKEN
            # Inbound guard credential (HeurekaFeedMutationGuard /
            # HeurekaOrderIngestionGuard). Same no-`envFrom` caveat as above: it
            # reaches the container only because it is named here. Previously the
            # live cluster mapped this to heureka-service-secret#JWT_TOKEN, the
            # shared a2880693 value, while catalog-microservice presented its own
            # identity credential — so this lane returned 401 in production.
            - name: HEUREKA_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: heureka-service-secret
                  key: HEUREKA_INTERNAL_SERVICE_TOKEN
          startupProbe:
            httpGet:
              path: /health
              port: 3800
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3800
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3800
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
