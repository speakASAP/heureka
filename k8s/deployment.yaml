apiVersion: apps/v1
kind: Deployment
metadata:
  name: heureka-service
  namespace: statex-apps
  labels:
    app: heureka-service
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heureka-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: heureka-service
    spec:
      containers:
        - name: app
          image: localhost:5000/heureka-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3800
          envFrom:
            - configMapRef:
                name: heureka-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: heureka-database-url-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: heureka-service-secret
                  key: JWT_SECRET
            - name: WAREHOUSE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: warehouse-microservice-secret
                  key: CLIPLOT_WAREHOUSE_SERVICE_TOKEN
            # Per-pair RS256 principal for heureka-service -> orders-microservice.
            # This pod has no `envFrom: secretRef`, so a key existing in the
            # ExternalSecret is NOT enough — it reaches the container only when
            # named here. Omitting it is why ORDERS_SERVICE_TOKEN stayed unset and
            # the lane silently kept using the shared a2880693 static header.
            - name: ORDERS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: heureka-service-secret
                  key: ORDERS_SERVICE_TOKEN
          startupProbe:
            httpGet:
              path: /health
              port: 3800
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3800
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3800
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
